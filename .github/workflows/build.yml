name: Build FPGA images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit hash to build
        required: true
        default: main
        type: string

  push:
    tags:
      - "*"

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    fpga-build-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-build:
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 1
          lfs: true

      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          set -eu

          sha="$(git rev-parse HEAD)"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:8}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: SPACE
            grade: SPACE
            versal: ""
          - id: DEV
            grade: DEV
            versal: ""
          - id: DEV-VE2002
            grade: DEV
            versal: VE2002

    name: Build ${{ matrix.id }} @ ${{ needs.prepare-build.outputs.short_sha }}

    runs-on: >-
      runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/runner=vivado-2025-2

    timeout-minutes: 60

    steps:
      - name: Checkout source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-build.outputs.sha }}
          fetch-depth: 1
          lfs: true

      - name: Checkout workflow scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Check environment
        shell: bash
        run: "$GITHUB_WORKSPACE/.workflow/.github/scripts/check-vivado-environment.sh"

      - name: Build ${{ matrix.id }}
        working-directory: versal
        shell: bash
        env:
          GRADE: ${{ matrix.grade }}
          VERSAL: ${{ matrix.versal }}
        run: "$GITHUB_WORKSPACE/.workflow/.github/scripts/build-fpga.sh"

      - name: Collect build artifacts
        id: artifacts
        shell: bash
        env:
          BUILD_ID: ${{ matrix.id }}
          GRADE: ${{ matrix.grade }}
          VERSAL: ${{ matrix.versal }}
          SHORT_SHA: ${{ needs.prepare-build.outputs.short_sha }}
        run: "$GITHUB_WORKSPACE/.workflow/.github/scripts/collect-fpga-artifacts.sh"

      - name: Store build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fpga-${{ matrix.id }}-${{ needs.prepare-build.outputs.short_sha }}
          path: ${{ runner.temp }}/fpga-${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs:
      - prepare-build
      - build

    if: ${{ github.event.repository.fork == false }}

    runs-on: ubuntu-latest

    environment: fpga-publish

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: fpga-*-${{ needs.prepare-build.outputs.short_sha }}
          path: ${{ runner.temp }}/fpga-artifacts
          merge-multiple: true

      - name: Create R2 upload commands
        id: r2
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_RELEASE_PREFIX: ${{ vars.R2_RELEASE_PREFIX || 'products/scobc-v1/releases' }}
          R2_RELEASE_VE2002_PREFIX: ${{ vars.R2_RELEASE_VE2002_PREFIX || 'developments/scobc-v1/releases' }}
          SHA: ${{ needs.prepare-build.outputs.sha }}
        run: "$GITHUB_WORKSPACE/.workflow/.github/scripts/create-r2-upload-commands.sh"

      - name: Publish build artifacts
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ steps.r2.outputs.commands }}
